<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تفاصيل الفعالية: الموعد والمكان والوصف والحجز.">
  <title>تفاصيل الفعالية — دليل فعاليات SVU</title>
  <link rel="icon" href="assets/img/logo.png" type="image/png">
  <!-- Bootstrap 5 (نسخة RTL) عبر CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <!-- أيقونات Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- خط Cairo من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- تنسيقاتنا الخاصة -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="event">
<!-- سيتم حقن الترويسة هنا تلقائياً -->
  <div id="header-placeholder"></div>

  <main>
    <!-- ترويسة الصفحة: عنوان الفعالية يُملأ من JavaScript حسب ?id= في الرابط -->
    <section class="page-hero">
      <div class="container">
        <nav aria-label="مسار التنقل"><ol class="breadcrumb mb-2">
          <li class="breadcrumb-item"><a href="index.html">الرئيسية</a></li>
          <li class="breadcrumb-item"><a href="events.html">الفعاليات</a></li>
          <li class="breadcrumb-item active" aria-current="page" id="evCrumb">...</li>
        </ol></nav>
        <div id="evBadge" class="mb-2"></div>
        <h1 id="evTitle">جارٍ التحميل...</h1>
        <p class="mb-0 opacity-75" id="evShort"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="row g-4">
          <!-- الصورة، الوصف، المعرض، الخريطة -->
          <div class="col-lg-8">
            <img id="evCover" class="detail-cover mb-4" src="assets/img/events/hackathon.svg" alt="">
            <h2 class="section-title h4">عن الفعالية</h2>
            <p id="evDesc" class="fs-6"></p>

            <h2 class="section-title h4 mt-4">معرض الصور</h2>
            <div class="row g-2 gallery" id="evGallery"></div>
            <p class="small text-muted mt-1"><i class="bi bi-zoom-in"></i> اضغط على الصورة لتكبيرها</p>

            <h2 class="section-title h4 mt-4">موقع الفعالية</h2>
            <figure>
              <img src="assets/img/map.svg" class="map-img" alt="خريطة توضيحية لموقع الفعالية">
              <figcaption class="small text-muted mt-1"><i class="bi bi-geo-alt-fill text-danger"></i> <span id="mapCaption"></span> (خريطة توضيحية)</figcaption>
            </figure>
          </div>

          <aside class="col-lg-4">
            <div class="info-box position-sticky" style="top:90px">
              <div id="evStatus" class="mb-2"></div>
              <ul class="list-unstyled mb-3">
                <li><i class="bi bi-calendar-event"></i><div><small class="text-muted d-block">التاريخ</small><b id="evDate"></b></div></li>
                <li><i class="bi bi-clock"></i><div><small class="text-muted d-block">الوقت</small><b id="evTime" dir="ltr"></b></div></li>
                <li><i class="bi bi-geo-alt"></i><div><small class="text-muted d-block">المكان</small><b id="evVenue"></b></div></li>
                <li><i class="bi bi-ticket-perforated"></i><div><small class="text-muted d-block">السعة</small><b id="evSeats"></b></div></li>
              </ul>
              <div class="d-grid gap-2">
                <button id="bookBtn" class="btn btn-accent btn-lg" data-bs-toggle="modal" data-bs-target="#bookModal"><i class="bi bi-ticket"></i> احجز مكانك</button>
                <div class="d-flex gap-2">
                  <button id="calBtn" class="btn btn-outline-primary flex-fill"><i class="bi bi-calendar-plus"></i> أضف للتقويم</button>
                  <button id="shareBtn" class="btn btn-outline-primary flex-fill"><i class="bi bi-share"></i> شارك</button>
                </div>
              </div>
              <div id="actionAlert" class="mt-3"></div>
            </div>
          </aside>
        </div>

        <!-- فعاليات ذات صلة -->
        <h2 class="section-title h4 mt-5 mb-4">فعاليات ذات صلة</h2>
        <div class="row g-4" id="relatedEvents"></div>
      </div>
    </section>
  </main>

  <!-- ===== Modal: حجز مكان  ===== -->
  <div class="modal fade" id="bookModal" tabindex="-1" aria-labelledby="bookModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="bookForm" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="bookModalLabel"><i class="bi bi-ticket-perforated text-primary"></i> حجز مكان</h2>
            <button type="button" class="btn-close ms-0 me-auto" data-bs-dismiss="modal" aria-label="إغلاق"></button>
          </div>
          <div class="modal-body">
            <div id="bookAlert"></div>
            <div class="mb-3">
              <label for="bName" class="form-label">الاسم الكامل</label>
              <input id="bName" class="form-control" type="text">
              <div class="invalid-feedback">أدخل اسمك (3 أحرف على الأقل).</div>
            </div>
            <div class="mb-3">
              <label for="bEmail" class="form-label">البريد الإلكتروني</label>
              <input id="bEmail" class="form-control" type="email" dir="ltr">
              <div class="invalid-feedback">صيغة البريد غير صحيحة.</div>
            </div>
            <div class="mb-1">
              <label for="bCount" class="form-label">عدد المقاعد (1 - 5)</label>
              <input id="bCount" class="form-control" type="number" min="1" max="5" value="1">
              <div class="invalid-feedback">العدد يجب أن يكون بين 1 و5.</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">إلغاء</button>
            <button type="submit" class="btn btn-primary">تأكيد الحجز</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ===== Modal: تكبير صورة المعرض ===== -->
  <div class="modal fade" id="imgModal" tabindex="-1" aria-label="عرض الصورة" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-transparent border-0">
        <button type="button" class="btn-close btn-close-white ms-auto mb-2" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        <img id="imgModalSrc" src="" alt="صورة مكبّرة" class="rounded-4 w-100">
      </div>
    </div>
  </div>

<!-- سيتم حقن التذييل هنا تلقائياً -->
  <div id="footer-placeholder"></div>

  <!-- زر العودة للأعلى -->
  <button id="toTop" type="button" aria-label="العودة للأعلى"><i class="bi bi-arrow-up"></i></button>

  <!-- Bootstrap JS عبر CDN + ملف JavaScript الخاص بنا -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
